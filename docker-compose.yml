# Local / single-server stack: PHP-FPM + nginx + MySQL.
#   cp .env.example .env   (set DB_HOST=db, DB_PASSWORD, APP_KEY, SEED_ADMIN_*)
#   docker compose up -d --build
#   docker compose exec app php bin/console migrate
#   docker compose exec app php bin/console db:seed
services:
  app:
    build: { context: ., dockerfile: deploy/docker/Dockerfile }
    env_file: .env
    environment: { DB_HOST: db }
    volumes:
      - storage:/var/www/dropboxphp/storage
    depends_on: [db]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./public:/var/www/dropboxphp/public:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

  cron:
    build: { context: ., dockerfile: deploy/docker/Dockerfile }
    env_file: .env
    environment: { DB_HOST: db }
    volumes:
      - storage:/var/www/dropboxphp/storage
    command: ["sh", "-c", "while true; do php bin/console cron; sleep 300; done"]
    depends_on: [db]
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dropbox}
      MYSQL_USER: ${DB_USERNAME:-dropbox}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped

volumes:
  storage:
  mysql:
