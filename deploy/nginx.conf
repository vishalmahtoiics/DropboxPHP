# Sample nginx server block. The document root is public/ — never the project root.
server {
    listen 80;
    server_name www.example.com example.com;
    root /var/www/dropboxphp/public;
    index index.php;

    client_max_body_size 20m;
    server_tokens off;

    # Hashed static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never serve dotfiles (.env, .git, .htaccess)
    location ~ /\. { deny all; return 404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller is executable
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # or 127.0.0.1:9000 / app:9000
        fastcgi_read_timeout 300;
    }
    location ~ \.php$ { return 404; }
}
